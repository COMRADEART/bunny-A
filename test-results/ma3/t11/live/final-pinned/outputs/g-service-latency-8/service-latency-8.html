<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latency data for services</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 20px;
    }
    #latency {
      border: 1px solid #ddd;
      padding: 20px;
      margin: 20px 0;
    }
    .service {
      margin: 10px 0;
    }
    .service > span {
      display: block;
    }
    .service > .name {
      font-weight: bold;
    }
    .service > .value {
      margin-left: 10px;
    }
    .status {
      float: right;
    }
  </style>
</head>
<body>
  <section id="latency">
    <span class="name">auth</span>: <span class="value">42 ms</span> - <span class="status">ok</span>
    <br>
    <span class="name">search</span>: <span class="value">310 ms</span> - <span class="status">warning</span>
    <br>
    <span class="name">billing</span>: <span class="value">88 ms</span> - <span class="status">ok</span>
    <br>
    <span class="name">export</span>: <span class="value">0 ms</span> - <span class="status">error</span>
    <br>
    <span class="name">notify</span>: <span class="value">51 ms</span> - <span class="status">ok</span>
  </section>
  <p class="notes">Latency values in ms.</p>
</body>
</html>
