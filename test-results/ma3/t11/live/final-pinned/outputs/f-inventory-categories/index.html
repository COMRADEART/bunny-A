<!DOCTYPE html>
<html>
<head>
  <style>
    #categories {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
    }
    .category-section {
      margin-bottom: 10px;
    }
    .category-name {
      font-weight: bold;
      font-size: 1.1em;
    }
  </style>
  <title>Inventory by Category</title>
</head>
<body>
  <h1>Inventory by Category</h1>
  <div id="categories">
    <div class="category-section">
      <div class="category-name">parts</div>
      <ul>
        <li>Widgets (120)</li>
        <li>Gadgets (8, status: warning)</li>
        <li>Sprockets (0, status: error)</li>
      </ul>
    </div>
    <div class="category-section">
      <div class="category-name">accessories</div>
      <ul>
        <li>Cables (64)</li>
        <li>Adapters (15, status: warning)</li>
      </ul>
    </div>
    <div class="category-section">
      <div class="category-name">power</div>
      <ul>
        <li>Batteries (42)</li>
      </ul>
    </div>
  </div>
  <p class="notes">All counts are based on available items.</p>
</body>
</html>
