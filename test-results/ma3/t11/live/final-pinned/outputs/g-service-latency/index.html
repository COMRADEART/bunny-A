<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Latency data for services</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 20px; }
      .latency-list { list-style: none; }
      .latency-item { margin: 8px 0; }
      .latency-item .name { font-weight: bold; }
      .latency-item .status { color: #666; }
    </style>
  </head>
  <body>
    <h1 id="latency">Latency data for services</h1>
    <ul class="latency-list">
      <li class="latency-item"><span class="name">auth</span>: 42 ms, <span class="status">ok</span></li>
      <li class="latency-item"><span class="name">search</span>: 310 ms, <span class="status">warning</span></li>
      <li class="latency-item"><span class="name">billing</span>: 88 ms, <span class="status">ok</span></li>
      <li class="latency-item"><span class="name">export</span>: 0 ms, <span class="status">error</span></li>
      <li class="latency-item"><span class="name">notify</span>: 51 ms, <span class="status">ok</span></li>
    </ul>
    <p class="notes">Service status and latency values are as per <i>data/services.csv</i>.</p>
  </body>
</html>
