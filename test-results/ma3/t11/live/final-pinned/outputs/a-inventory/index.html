<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory data for the offline dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; }
    .summary { background-color: #f0f0f0; padding: 10px; margin: 10px 0; }
    .item { margin: 5px 0; }
    .ok { color: green; }
    .warning { color: orange; }
    .error { color: red; }
  </style>
</head>
<body>
  <div id="summary">
    <p>Summary of inventory data.</p>
  </div>
  <div class="item">Widgets (parts): 120 (ok)</div>
  <div class="item">Gadgets (parts): 8 (warning)</div>
  <div class="item">Sprockets (parts): 0 (error)</div>
  <div class="item">Cables (accessories): 64 (ok)</div>
  <div class="item">Adapters (accessories): 15 (warning)</div>
  <div class="item">Batteries (power): 42 (ok)</div>
</body>
</html>
